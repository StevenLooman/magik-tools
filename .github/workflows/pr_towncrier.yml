name: Pull Request requires towncrier file

on:
  - pull_request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr_require_towncrier_file:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v6
      - name: Ensure towncrier file exists
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          if [ ! -f "changes/${PR_NUMBER}.feature.md" ] && [ ! -f "changes/${PR_NUMBER}.bugfix.md" ] && [ ! -f "changes/${PR_NUMBER}.doc.md" ] && [ ! -f "changes/${PR_NUMBER}.removal.md" ] && [ ! -f "changes/${PR_NUMBER}.misc.md" ]; then
            echo "Towncrier file for #${PR_NUMBER} not found. Please add a changes file to the `changes/` directory. See README.md for more information."
            exit 1
          fi
