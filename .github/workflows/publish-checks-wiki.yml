name: Publish checks to wiki
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/publish-checks-wiki.yml
      - .github/scripts/generate-checks-pages.py
      - magik-checks/src/main/resources/nl/ramsolutions/sw/sonar/l10n/*/rules/*.html
      - magik-checks/src/main/java/nl/ramsolutions/sw/checks/*/*Check.java
concurrency:
  group: publish-checks-wiki
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: |
          pip install -r .github/scripts/requirements.txt
          python3 .github/scripts/generate-checks-pages.py
      - uses: DavidAnson/markdownlint-cli2-action@v22
        with:
          globs: 'wiki/checks/*.md'
          fix: true
      - uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: wiki
          #dry-run: true
        if: ${{ github.repository_owner == 'StevenLooman' }}
