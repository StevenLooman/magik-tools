name: Publish checks to wiki
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/publish-checks-wiki.yml
      - .github/scripts/generate_checks_pages.py
      - magik-checks/src/main/resources/nl/ramsolutions/sw/sonar/l10n/*/rules/*.html
      - magik-checks/src/main/java/nl/ramsolutions/sw/checks/*/*Check.java
  pull_request:
    paths:
      - .github/workflows/publish-checks-wiki.yml
      - .github/scripts/generate_checks_pages.py
      - magik-checks/src/main/resources/nl/ramsolutions/sw/sonar/l10n/*/rules/*.html
      - magik-checks/src/main/java/nl/ramsolutions/sw/checks/*/*Check.java
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}

jobs:
  generate-wiki:
    name: Generate checks pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: |
          pip install --only-binary :all: --require-hashes -r .github/scripts/requirements.txt
          python3 .github/scripts/generate_checks_pages.py
      - run: |
          npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund
          .github/scripts/node_modules/.bin/markdownlint-cli2 --fix 'wiki/checks/*.md'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wiki-checks
          path: wiki/checks
          retention-days: 1

  publish-wiki:
    name: Publish checks pages to wiki
    needs: generate-wiki
    if: ${{ github.event_name == 'push' && github.repository_owner == 'StevenLooman' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Push to the wiki repository.
    steps:
      - run: |
          git clone https://github.com/StevenLooman/magik-tools.wiki.git wiki
          rm -rf wiki/checks
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wiki-checks
          path: wiki/checks
      - name: Publish wiki
        working-directory: wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo "Wiki is up to date"
            exit 0
          fi
          git commit --message "Update wiki ${GITHUB_SHA}"
          gh auth setup-git
          git push
