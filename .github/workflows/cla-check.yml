name: CLA Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}
    steps:
      - name: Check CLA signature
        id: cla
        uses: actions/github-script@v9
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const needle = `| ${author} |`.toLowerCase();

            // Read CLA-SIGNERS through the API rather than checking out the pull request. This
            // workflow runs as `pull_request_target`, where checking out a fork's code is refused
            // by actions/checkout.
            const readSigners = async (ref) => {
              try {
                const response = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: "CLA-SIGNERS",
                  ref,
                });
                return Buffer.from(response.data.content, "base64").toString("utf8");
              } catch (error) {
                if (error.status === 404) {
                  return "";
                }
                throw error;
              }
            };

            console.log(`Checking CLA for user: ${author}`);

            let signed = false;
            for (const ref of [context.payload.pull_request.head.sha, context.payload.pull_request.base.ref]) {
              if ((await readSigners(ref)).toLowerCase().includes(needle)) {
                signed = true;
                break;
              }
            }

            console.log(signed ? `CLA signed by ${author}` : `CLA not signed by ${author}`);
            core.setOutput("signed", String(signed));

      - name: Post comment if CLA not signed
        if: steps.cla.outputs.signed == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;

            // Check if we already posted a CLA reminder
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(
              (c) => c.user.type === "Bot" && c.body.includes("Contributor License Agreement")
            );

            if (!botComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `### 📝 CLA Signature Required\n\nHi @${author}, thank you for your contribution!\n\nBefore we can merge this pull request, you need to sign our [Contributor License Agreement](${repoUrl}/blob/${context.payload.pull_request.base.ref}/CLA.md).\n\n**How to sign:**\n1. Read the [CLA](${repoUrl}/blob/${context.payload.pull_request.base.ref}/CLA.md)\n2. Add your entry to the [CLA-SIGNERS](${repoUrl}/blob/${context.payload.pull_request.base.ref}/CLA-SIGNERS) file\n3. Submit a separate PR with your signature, or add it to this PR\n\nOnce the CLA-SIGNERS file includes your GitHub username, this check will pass automatically on the next update.\n\nIf you have any questions, feel free to ask!`,
              });
            }

      - name: Set check status
        if: always()
        uses: actions/github-script@v9
        env:
          CLA_SIGNED: ${{ steps.cla.outputs.signed }}
        with:
          script: |
            // An empty output means the check itself never produced a verdict, which is an error in
            // this workflow rather than a missing signature.
            const outcome = process.env.CLA_SIGNED || "errored";
            const signed = outcome === "true";

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: signed ? "success" : outcome === "false" ? "failure" : "error",
              description: signed
                ? "CLA has been signed"
                : outcome === "false"
                  ? "CLA signature required — see PR comment for instructions"
                  : "CLA check failed to run",
              context: "CLA Check",
            });

            if (outcome === "false") {
              core.setFailed("CLA not signed by " + context.payload.pull_request.user.login);
            } else if (!signed) {
              core.setFailed("CLA check failed to run — see the failing step above");
            }
