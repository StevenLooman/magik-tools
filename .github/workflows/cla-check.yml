name: CLA Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Check CLA signature
        id: cla
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          echo "Checking CLA for user: $PR_AUTHOR"

          signed=false
          for dir in head base; do
            if [ -f "$dir/CLA-SIGNERS" ] && grep -qiF "| ${PR_AUTHOR} |" "$dir/CLA-SIGNERS"; then
              signed=true
              break
            fi
          done

          if [ "$signed" = "true" ]; then
            echo "CLA signed by $PR_AUTHOR"
          else
            echo "CLA not signed by $PR_AUTHOR"
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      - name: Post comment if CLA not signed
        if: steps.cla.outputs.signed == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;

            // Check if we already posted a CLA reminder
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(
              (c) => c.user.type === "Bot" && c.body.includes("Contributor License Agreement")
            );

            if (!botComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `### 📝 CLA Signature Required\n\nHi @${author}, thank you for your contribution!\n\nBefore we can merge this pull request, you need to sign our [Contributor License Agreement](${repoUrl}/blob/${context.payload.pull_request.base.ref}/CLA.md).\n\n**How to sign:**\n1. Read the [CLA](${repoUrl}/blob/${context.payload.pull_request.base.ref}/CLA.md)\n2. Add your entry to the [CLA-SIGNERS](${repoUrl}/blob/${context.payload.pull_request.base.ref}/CLA-SIGNERS) file\n3. Submit a separate PR with your signature, or add it to this PR\n\nOnce the CLA-SIGNERS file includes your GitHub username, this check will pass automatically on the next update.\n\nIf you have any questions, feel free to ask!`,
              });
            }

      - name: Set check status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const signed = "${{ steps.cla.outputs.signed }}" === "true";

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: signed ? "success" : "failure",
              description: signed
                ? "CLA has been signed"
                : "CLA signature required — see PR comment for instructions",
              context: "CLA Check",
            });

            if (!signed) {
              core.setFailed("CLA not signed by " + context.payload.pull_request.user.login);
            }
