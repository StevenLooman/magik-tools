name: Package and create a release with assets
on:
  push:
    tags:
      - "*"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
permissions: {}

jobs:
  release:
    name: Package and create a release with assets
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Create the release and upload its assets.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 17
          distribution: 'zulu'
      - name: Test and package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn --batch-mode --update-snapshots verify test package
      - run: mkdir -v staging && cp -v **/target/*.jar staging
      - run: npm ci && npm run package
        working-directory: magik-language-server/client-vscode
      - run: cp -v magik-language-server/client-vscode/magik-language-server-*.vsix staging
      - run: rm -vf staging/original-*.jar

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --notes "" staging/*
