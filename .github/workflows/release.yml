name: Package and create a release with assets
on:
  push:
    tags:
      - "*"

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Package and create a release with assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          java-version: 17
          distribution: 'zulu'
          cache: 'maven'
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Test and package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn --batch-mode --update-snapshots verify test package
      - run: mkdir -v staging && cp -v **/target/*.jar staging
      - run: npm ci && npm run package
        working-directory: magik-language-server/client-vscode
      - run: cp -v magik-language-server/client-vscode/magik-language-server-*.vsix staging
      - run: rm -vf staging/original-*.jar

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          files: |
            staging/*
