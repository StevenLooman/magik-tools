name: Lint and package
on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
permissions: {}

jobs:
  build:
    name: Build, test and package
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 17
          distribution: 'zulu'
          cache: 'maven'
      - name: Test and package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn --batch-mode --update-snapshots verify test package
      - run: |
          mkdir -v staging
          cp -v **/target/*.jar staging
          rm -fv staging/original-*.jar
      - run: npm ci && npm run package
        working-directory: magik-language-server/client-vscode
      - run: cp -v magik-language-server/client-vscode/magik-language-server-*.vsix staging
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Package-${{ matrix.os }}
          path: staging

  markdown_lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Towncrier
        run: 'python -m pip install --disable-pip-version-check --only-binary :all: --require-hashes -r .github_tools/ci/requirements.txt'
      - name: Render draft changelog for linting
        run: |
          printf '# Changes\n\n<!-- towncrier release notes start -->\n\n' > CHANGES.preview.md
          towncrier build --draft --version 0.0.0 | perl -0pe 's/\n+\z/\n/' >> CHANGES.preview.md
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install markdownlint-cli2
        run: npm ci --prefix .github_tools/ci --ignore-scripts --no-audit --no-fund
      - name: Run markdownlint-cli2
        run: .github_tools/ci/node_modules/.bin/markdownlint-cli2 '**/*.md' '#**/node_modules'

  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts && npm run eslint
        working-directory: magik-language-server/client-vscode

  codespell:
    name: Codespell
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Codespell
        run: 'python -m pip install --disable-pip-version-check --only-binary :all: --require-hashes -r .github_tools/ci/requirements.txt'
      - name: Run Codespell
        run: codespell
