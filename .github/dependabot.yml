version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # 1.28.0 is the last google-java-format release supporting Java 17.
      - dependency-name: "com.google.googlejavaformat:google-java-format"
        versions: [">=1.29.0"]
      # Later sonar-analyzer-commons releases are under the Sonar Source-Available License, not the LGPL.
      - dependency-name: "org.sonarsource.analyzer-commons:*"
        versions: [">=2.17.0"]
      # SSLR 1.25+ is under the Sonar Source-Available License, not the LGPL.
      - dependency-name: "org.sonarsource.sslr:*"
        versions: [">=1.25.0"]
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "magik-language-server/client-vscode"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/.github_tools/ci"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/.github_tools/ci"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
