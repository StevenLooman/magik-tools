version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # 1.28.0 is the last google-java-format release supporting Java 17.
      - dependency-name: "com.google.googlejavaformat:google-java-format"
        versions: [">=1.29.0"]
  - package-ecosystem: "npm"
    directory: "magik-language-server/client-vscode"
    schedule:
      interval: weekly
  - package-ecosystem: "pip"
    directory: ".github/scripts"
    schedule:
      interval: weekly
