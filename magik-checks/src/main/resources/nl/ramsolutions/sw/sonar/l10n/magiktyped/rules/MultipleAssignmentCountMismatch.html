<p>Multiple assignment count mismatch</p>
<h2>Explanation</h2>
<pre>
_method a.b
    (x, y, z) &lt;&lt; (1, 2)
_endmethod
</pre>
<p>In the above example, three variables are assigned from an expression that returns only two values. The third variable <pre>z</pre> will silently receive <pre>_unset</pre>.</p>
