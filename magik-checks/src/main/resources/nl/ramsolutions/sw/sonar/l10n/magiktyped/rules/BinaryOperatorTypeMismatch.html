<p>Binary operator type mismatch</p>
<h2>Explanation</h2>
<pre>
_method a.b
    _local x &lt;&lt; :symbol
    _local y &lt;&lt; :symbol + 1
    x +&lt;&lt; 1
_endmethod
</pre>
<p>In the above example, both <code>:symbol + 1</code> and <code>x +&lt;&lt; 1</code> apply <code>+</code> to <code>sw:symbol</code> and <code>sw:integer</code>, which is not a defined binary operation. This will result in a runtime error.</p>
