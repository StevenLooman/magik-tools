<p>Unary operator type mismatch</p>
<h2>Explanation</h2>
<pre>
_method a.b
    _local x &lt;&lt; :symbol
    _local y &lt;&lt; +x
_endmethod
</pre>
<p>In the above example, <code>+x</code> maps to the unary method <code>unary_plus</code>. When that method is not available for <code>sw:symbol</code>, the result type is undefined and can cause runtime failures.</p>
